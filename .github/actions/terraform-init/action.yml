name: Terraform init
description: Assume a role da AWS via OIDC, instala o Terraform e inicializa o backend S3.

inputs:
  role-arn:
    description: Role da AWS a assumir (repo variable AWS_TERRAFORM_ROLE_ARN).
    required: true
  state-bucket:
    description: Bucket S3 do estado (repo variable TF_STATE_BUCKET).
    required: true
  terraform-version:
    description: Versão do Terraform.
    default: "1.10.5"

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: us-east-1

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: terraform init
      shell: bash
      working-directory: infra
      env:
        STATE_BUCKET: ${{ inputs.state-bucket }}
      run: terraform init -input=false -backend-config="bucket=$STATE_BUCKET"
