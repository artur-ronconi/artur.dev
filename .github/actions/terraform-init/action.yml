name: Terraform init
description: Assume a role da AWS via OIDC, instala o Terraform e inicializa o backend S3.

inputs:
  account-id:
    description: ID da conta AWS (repo variable AWS_ACCOUNT_ID).
    required: true
  terraform-version:
    description: Versão do Terraform.
    default: "1.10.5"

runs:
  using: composite
  steps:
    # Nomes fixos, criados à mão no console (docs/deploy-aws.md).
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ inputs.account-id }}:role/artur-dev-github-terraform
        aws-region: us-east-1

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: terraform init
      shell: bash
      working-directory: infra
      env:
        STATE_BUCKET: artur-dev-tfstate-${{ inputs.account-id }}
      run: terraform init -input=false -backend-config="bucket=$STATE_BUCKET"
