name: Terraform init
description: Configura as credenciais da AWS, instala o Terraform e inicializa o backend S3.

inputs:
  aws-access-key-id:
    description: Secret TERRAFORM_AWS_ACCESS_KEY_ID.
    required: true
  aws-secret-access-key:
    description: Secret TERRAFORM_AWS_ACCESS_SECRET_KEY.
    required: true
  terraform-version:
    description: Versão do Terraform.
    default: "1.10.5"

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: us-east-1

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    # Bucket de estado criado à mão no console (docs/deploy-aws.md); o nome usa o ID da conta.
    - name: terraform init
      shell: bash
      working-directory: infra
      run: |
        account_id="$(aws sts get-caller-identity --query Account --output text)"
        terraform init -input=false -backend-config="bucket=artur-dev-tfstate-$account_id"
