name: Terraform

# plan:    automático em PRs que mexem em infra/ e sob demanda (Actions → Run workflow)
# apply:   sob demanda, depois do plan
# destroy: sob demanda, com confirmação digitada ("destroy")
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
      - ".github/actions/terraform-init/**"
  workflow_dispatch:
    inputs:
      action:
        description: O que executar
        type: choice
        options: [plan, apply, destroy]
        default: plan
      delete_buckets:
        description: "destroy: apagar também os buckets de mídia e backups, mesmo com objetos (irreversível)"
        type: boolean
        default: false
      replace_instance:
        description: "apply: recriar a instância (aplica mudanças de cloud-init/AMI; o SQLite é perdido — restaure o backup)"
        type: boolean
        default: false
      confirm:
        description: 'destroy: digite "destroy" para confirmar'
        type: string
        default: ""

permissions:
  contents: read

# Uma execução por vez: o estado remoto é único.
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_acme_email: ${{ vars.ACME_EMAIL }}

defaults:
  run:
    shell: bash
    working-directory: infra

jobs:
  plan:
    if: github.event_name == 'pull_request' || inputs.action == 'plan' || inputs.action == 'apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform-init
        with:
          aws-access-key-id: ${{ secrets.TERRAFORM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TERRAFORM_AWS_ACCESS_SECRET_KEY }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m | tee plan.txt

      - name: Resumo do plan
        if: always()
        run: |
          {
            echo '### terraform plan'
            echo '```'
            tail -n 200 plan.txt 2>/dev/null || echo "(sem saída)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform-init
        with:
          aws-access-key-id: ${{ secrets.TERRAFORM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TERRAFORM_AWS_ACCESS_SECRET_KEY }}

      - name: terraform apply
        env:
          REPLACE_INSTANCE: ${{ inputs.replace_instance }}
        run: |
          args=()
          if [ "$REPLACE_INSTANCE" = "true" ]; then args+=(-replace=aws_instance.app); fi
          terraform apply -input=false -auto-approve -no-color -lock-timeout=5m "${args[@]}"

      - name: Saídas
        run: |
          {
            echo '### terraform output'
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    env:
      TF_VAR_force_destroy_buckets: ${{ inputs.delete_buckets }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Confirmação
        working-directory: .
        run: |
          if [ "$CONFIRM" != "destroy" ]; then
            echo "::error::Digite \"destroy\" no campo confirm para destruir a infraestrutura."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform-init
        with:
          aws-access-key-id: ${{ secrets.TERRAFORM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TERRAFORM_AWS_ACCESS_SECRET_KEY }}

      # force_destroy só vale se já estiver gravado no estado: aplica nos buckets antes.
      - name: Liberar a remoção dos buckets
        if: inputs.delete_buckets
        run: |
          terraform apply -input=false -auto-approve -no-color -lock-timeout=5m \
            -target=aws_s3_bucket.media -target=aws_s3_bucket.backups

      - name: terraform destroy
        run: terraform destroy -input=false -auto-approve -no-color -lock-timeout=5m
